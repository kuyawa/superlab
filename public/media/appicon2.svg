<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    
    <!-- Glass gradient for test tube -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.3)"/>
    </linearGradient>
    
    <!-- Liquid gradient -->
    <linearGradient id="liquidGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00a884"/>
    </linearGradient>
    
    <!-- Drop shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- App icon background (rounded square) -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bgGradient)"/>
  
  <!-- Test tube group -->
  <g transform="translate(512, 512)" filter="url(#shadow)">
    <!-- Test tube outer shape -->
    <path d="M-120,-180 L-120,120 Q-120,200 0,200 Q120,200 120,120 L120,-180 Z" 
          fill="url(#glassGradient)" 
          stroke="rgba(255,255,255,0.6)" 
          stroke-width="8"/>
    
    <!-- Test tube rim -->
    <ellipse cx="0" cy="-180" rx="120" ry="30" 
             fill="rgba(255,255,255,0.2)" 
             stroke="rgba(255,255,255,0.8)" 
             stroke-width="8"/>
    
    <!-- Liquid inside -->
    <path d="M-104,0 L-104,120 Q-104,184 0,184 Q104,184 104,120 L104,0 Q60,20 0,20 Q-60,20 -104,0 Z" 
          fill="url(#liquidGradient)"/>
    
    <!-- Bubbles in liquid -->
    <circle cx="-40" cy="80" r="15" fill="rgba(255,255,255,0.4)"/>
    <circle cx="50" cy="120" r="10" fill="rgba(255,255,255,0.4)"/>
    <circle cx="30" cy="60" r="8" fill="rgba(255,255,255,0.3)"/>
    
    <!-- Medical cross on test tube -->
    <g transform="translate(0, -80)">
      <rect x="-50" y="-15" width="100" height="30" rx="6" fill="white"/>
      <rect x="-15" y="-50" width="30" height="100" rx="6" fill="white"/>
    </g>
    
    <!-- Highlight on glass -->
    <path d="M-80,-160 L-80,100" 
          stroke="rgba(255,255,255,0.5)" 
          stroke-width="12" 
          stroke-linecap="round"/>
  </g>
</svg>