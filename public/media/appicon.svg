<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Accent Glow / Lens Highlight -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Metal Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Stage Drop Shadow -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Background (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg-grad)"/>

  <!-- Subtle Inner Border/Highlight -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="4"/>

  <!-- Main Microscope Group -->
  <g filter="url(#drop-shadow)" transform="translate(0, 0)">
    
    <!-- Base Assembly -->
    <!-- Rubber Foot Pads -->
    <rect x="136" y="392" width="240" height="16" rx="8" fill="#0F172A"/>
    <!-- Main Heavy Base -->
    <path d="M 152 360 L 360 360 C 373.255 360 384 370.745 384 384 L 128 384 C 128 370.745 138.745 360 152 360 Z" fill="url(#metal-grad)"/>
    <path d="M 160 344 L 352 344 C 360.837 344 368 351.163 368 360 L 144 360 C 144 351.163 151.163 344 160 344 Z" fill="#64748B"/>

    <!-- Curved Arm / Backbone -->
    <path d="M 320 344 C 320 344 360 280 360 216 C 360 160 320 136 280 136 C 265 136 250 142 240 152" 
          fill="none" stroke="url(#metal-grad)" stroke-width="36" stroke-linecap="round"/>
    <!-- Arm Shadow Accent -->
    <path d="M 320 344 C 320 344 360 280 360 216 C 360 180 340 152 310 142" 
          fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round" opacity="0.3"/>

    <!-- Stage Assembly -->
    <!-- Sub-stage Light Condenser -->
    <path d="M 200 312 L 248 312 L 240 332 L 208 332 Z" fill="#475569"/>
    <!-- Stage Plate -->
    <rect x="152" y="296" width="144" height="16" rx="4" fill="url(#metal-grad)"/>
    <!-- Stage Clips / Slide -->
    <rect x="200" y="290" width="48" height="6" rx="3" fill="url(#cyan-glow)"/>

    <!-- Coarse & Fine Focus Knobs -->
    <circle cx="324" cy="248" r="22" fill="url(#metal-grad)"/>
    <circle cx="324" cy="248" r="14" fill="#475569"/>
    <circle cx="324" cy="248" r="6" fill="#94A3B8"/>

    <!-- Microscope Body / Optical Tube (Angled at 30 deg) -->
    <g transform="rotate(-30 200 200)">
      <!-- Eyepiece Tube -->
      <rect x="188" y="60" width="24" height="50" rx="4" fill="url(#metal-grad)"/>
      <rect x="180" y="50" width="40" height="14" rx="4" fill="#334155"/>
      <!-- Rubber Eyepiece Shield -->
      <path d="M 176 40 L 224 40 L 220 50 L 180 50 Z" fill="#0F172A"/>

      <!-- Main Body Tube -->
      <rect x="176" y="104" width="48" height="96" rx="8" fill="url(#metal-grad)"/>
      <!-- Body Accent Ring -->
      <rect x="172" y="140" width="56" height="16" rx="4" fill="url(#cyan-glow)"/>

      <!-- Revolving Nosepiece / Objective Turret -->
      <path d="M 168 200 L 232 200 L 220 224 L 180 224 Z" fill="#334155"/>

      <!-- Active Objective Lens (Pointing Down to Stage) -->
      <rect x="190" y="224" width="20" height="36" rx="3" fill="url(#metal-grad)"/>
      <rect x="188" y="252" width="24" height="12" rx="2" fill="#0284C7"/>
      <!-- Secondary Lens (Rotated/Inactive) -->
      <rect x="168" y="216" width="16" height="28" rx="2" transform="rotate(35 168 216)" fill="#64748B"/>
    </g>

    <!-- Specimen Sample Glow/Light Beam -->
    <polygon points="210,296 238,296 248,256 200,256" fill="url(#cyan-glow)" opacity="0.25"/>
    <circle cx="224" cy="296" r="6" fill="#38BDF8"/>
  </g>
</svg>
